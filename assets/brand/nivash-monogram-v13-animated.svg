<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Nivash logo</title>
  <desc id="desc">The original Nivash monogram and wordmark drawing itself before settling into the complete logo.</desc>
  <style>
    .logo-segment {
      fill: #f4eee2;
      fill-opacity: 0;
      stroke: #f4eee2;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      filter: drop-shadow(0 0 10px rgba(226,233,207,.38));
      animation-duration: 20s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-delay: -4.8s;
    }
    .logo-symbol { animation-name: segment-symbol; }
    .logo-n { animation-name: segment-n; }
    .logo-i { animation-name: segment-i; }
    .logo-v { animation-name: segment-v; }
    .logo-a { animation-name: segment-a; }
    .logo-s { animation-name: segment-s; }
    .logo-h { animation-name: segment-h; }
    .logo-final {
      opacity: 0;
      animation: final-cycle 20s -4.8s ease-in-out infinite;
    }
    
    @keyframes segment-symbol {
      0%, 0.2% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      9%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 95.2% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      100%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes segment-n {
      0%, 8% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      10.3%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 92.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      95.7%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes segment-i {
      0%, 9.8% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      12.1%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 89.8% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      93%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes segment-v {
      0%, 11.6% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      13.9%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 87.1% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      90.3%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes segment-a {
      0%, 13.4% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      15.7%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 84.4% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      87.6%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes segment-s {
      0%, 15.2% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      17.5%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 81.7% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      84.9%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes segment-h {
      0%, 17% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 1; }
      19.3%, 20.5% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      23% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      24%, 73% { opacity: 0; fill-opacity: 1; stroke-dashoffset: 0; }
      76% { opacity: 1; fill-opacity: 1; stroke-dashoffset: 0; }
      78%, 79% { opacity: 1; fill-opacity: 0; stroke-dashoffset: 0; }
      82.2%, 100% { opacity: 1; fill-opacity: 0; stroke-dashoffset: -1; }
    }
    @keyframes final-cycle {
      0%, 20.5% { opacity: 0; }
      24%, 73% { opacity: 1; }
      76%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-segment { display: none; animation: none; }
      .logo-final { opacity: 1; animation: none; }
    }
  </style>
